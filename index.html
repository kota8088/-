      try {

        const prompt =
          `あなたはプロの翻訳家です。以下のテキストを【${targetLang}】に正確に翻訳してください。解説や挨拶は一切含めず、翻訳結果のテキストのみを出力してください。\n\n${input}`;


        const result =
          await fetchAiText(
            prompt
          );


        resDiv.textContent =
          result;


      } catch (err) {

        resDiv.textContent =
          texts.translateError;

      } finally {

        btn.disabled =
          false;

      }

    }


    function copyTrans() {

      const text =
        document.getElementById(
          'transResult'
        ).textContent;


      navigator.clipboard.writeText(
        text
      );


      alert(
        getTexts().copySuccess
      );

    }


    function speakTranslation() {

      const text =
        document.getElementById(
          'transResult'
        ).textContent;


      if (
        !text ||
        text ===
          getTexts().transPlaceholder
      ) return;


      const select =
        document.getElementById(
          'langSelect'
        );


      const langCode =
        select.options[
          select.selectedIndex
        ].getAttribute(
          'data-code'
        ) ||
        'ja-JP';


      speakText(
        text,
        langCode
      );

    }


    /* =========================
       Calculator
       ========================= */

    let calculatorState = {
      expression: [],
      currentInput: '0',
      waitingForOperand: false,
      justCalculated: false
    };


    let fractionInputMode = 0;

    let fractionBuffer = {
      integer: '',
      denominator: '',
      numerator: ''
    };


    function gcdBigInt(
      a,
      b
    ) {

      a =
        a < 0n
          ? -a
          : a;

      b =
        b < 0n
          ? -b
          : b;


      while (
        b !== 0n
      ) {

        const temp =
          a % b;

        a = b;
        b = temp;

      }


      return a;

    }


    function normalizeFraction(
      numerator,
      denominator
    ) {

      numerator =
        BigInt(numerator);

      denominator =
        BigInt(denominator);


      if (
        denominator === 0n
      ) {

        throw new Error(
          getTexts().calculatorDivideZero
        );

      }


      if (
        denominator < 0n
      ) {

        numerator =
          -numerator;

        denominator =
          -denominator;

      }


      if (
        numerator === 0n
      ) {

        return {
          n: 0n,
          d: 1n
        };

      }


      const g =
        gcdBigInt(
          numerator,
          denominator
        );


      return {
        n:
          numerator / g,

        d:
          denominator / g
      };

    }


    function addFractions(
      a,
      b
    ) {

      return normalizeFraction(
        a.n * b.d +
          b.n * a.d,

        a.d * b.d
      );

    }


    function subtractFractions(
      a,
      b
    ) {

      return normalizeFraction(
        a.n * b.d -
          b.n * a.d,

        a.d * b.d
      );

    }


    function multiplyFractions(
      a,
      b
    ) {

      return normalizeFraction(
        a.n * b.n,
        a.d * b.d
      );

    }


    function divideFractions(
      a,
      b
    ) {

      if (
        b.n === 0n
      ) {

        throw new Error(
          getTexts().calculatorDivideZero
        );

      }


      return normalizeFraction(
        a.n * b.d,
        a.d * b.n
      );

    }


    function gcdNumber(
      a,
      b
    ) {

      a =
        Math.abs(a);

      b =
        Math.abs(b);


      while (
        b > 1e-12
      ) {

        const temp =
          a % b;

        a = b;
        b = temp;

      }


      return a;

    }


    function parseDecimalToFraction(
      value
    ) {

      const text =
        String(value)
          .trim();


      if (!text)
        return {
          n: 0n,
          d: 1n
        };


      if (
        text.includes(
          'e'
        ) ||
        text.includes(
          'E'
        )
      ) {

        const num =
          Number(text);


        if (
          !Number.isFinite(num)
        ) {

          throw new Error(
            getTexts().calculatorError
          );

        }


        return parseDecimalToFraction(
          num.toString()
        );

      }


      if (
        text.includes('.')
      ) {

        const sign =
          text.startsWith('-')
            ? -1n
            : 1n;


        const clean =
          text.replace(
            '-',
            ''
          );


        const [
          integerPart,
          decimalPart
        ] =
          clean.split('.');


        const digits =
          decimalPart.length;


        const denominator =
          10n ** BigInt(digits);


        const numerator =
          BigInt(
            integerPart || '0'
          ) *
            denominator +
          BigInt(
            decimalPart || '0'
          );


        return normalizeFraction(
          sign * numerator,
          denominator
        );

      }


      return normalizeFraction(
        BigInt(text),
        1n
      );

    }


    function parseMixedFraction(
      integerText,
      numeratorText,
      denominatorText
    ) {

      const integerPart =
        BigInt(
          integerText || '0'
        );

      const numerator =
        BigInt(
          numeratorText || '0'
        );

      const denominator =
        BigInt(
          denominatorText || '1'
        );


      if (
        denominator === 0n
      ) {

        throw new Error(
          getTexts().calculatorDivideZero
        );

      }


      /*
       * 入力された分数部分をまず約分。
       */
      const reduced =
        normalizeFraction(
          numerator,
          denominator
        );


      /*
       * 帯分数の整数部分と分数部分を
       * 符号も含めて正規化。
       */
      if (
        integerPart < 0n
      ) {

        return normalizeFraction(
          integerPart *
              reduced.d -
            reduced.n,
          reduced.d
        );

      }


      return normalizeFraction(
        integerPart *
            reduced.d +
          reduced.n,
        reduced.d
      );

    }


    function formatBigFraction(
      fraction
    ) {

      const f =
        normalizeFraction(
          fraction.n,
          fraction.d
        );


      if (
        f.n === 0n
      ) {

        return {
          text: '0',
          html: '0'
        };

      }


      const negative =
        f.n < 0n;


      const absN =
        negative
          ? -f.n
          : f.n;


      const integerPart =
        absN / f.d;


      const remainder =
        absN % f.d;


      const sign =
        negative
          ? '-'
          : '';


      if (
        remainder === 0n
      ) {

        const text =
          sign +
          integerPart.toString();


        return {
          text,
          html:
            sanitizeHTML(
              text
            )
        };

      }


      const numeratorText =
        remainder.toString();

      const denominatorText =
        f.d.toString();


      if (
        integerPart === 0n
      ) {

        const text =
          `${sign}${numeratorText}/${denominatorText}`;


        const html =
          `
          ${sign}
          <span class="result-fraction-stack">
            <span class="result-fraction-numerator">
              ${sanitizeHTML(numeratorText)}
            </span>
            <span class="result-fraction-denominator">
              ${sanitizeHTML(denominatorText)}
            </span>
          </span>
          `;


        return {
          text,
          html
        };

      }


      const text =
        `${sign}${integerPart.toString()} ${numeratorText}/${denominatorText}`;


      const html =
        `
        <span class="calculator-result-fraction">
          <span class="result-mixed-integer">
            ${sign}${sanitizeHTML(
              integerPart.toString()
            )}
          </span>

          <span class="result-fraction-stack">
            <span class="result-fraction-numerator">
              ${sanitizeHTML(numeratorText)}
            </span>
            <span class="result-fraction-denominator">
              ${sanitizeHTML(denominatorText)}
            </span>
          </span>
        </span>
        `;


      return {
        text,
        html
      };

    }


    function fractionInputToFraction() {

      const integer =
        fractionBuffer.integer ||
        '0';

      const denominator =
        fractionBuffer.denominator ||
        '1';

      const numerator =
        fractionBuffer.numerator ||
        '0';


      return parseMixedFraction(
        integer,
        numerator,
        denominator
      );

    }


    function getCurrentCalculatorValue() {

      if (
        fractionInputMode !== 0
      ) {

        return fractionInputToFraction();

      }


      return parseDecimalToFraction(
        calculatorState.currentInput
      );

    }


    function makeCalculatorTokenFromCurrent() {

      const value =
        getCurrentCalculatorValue();


      return {
        type:
          'value',

        value,

        display:
          formatBigFraction(
            value
          )
      };

    }


    function calculatorResetExpression() {

      calculatorState = {
        expression: [],
        currentInput: '0',
        waitingForOperand: false,
        justCalculated: false
      };

    }


    function calculatorClear() {

      calculatorResetExpression();

      fractionInputMode = 0;

      fractionBuffer = {
        integer: '',
        denominator: '',
        numerator: ''
      };


      updateCalculatorDisplay();

      updateFractionStatus();

    }


    function calculatorNumber(
      digit
    ) {

      if (
        fractionInputMode !== 0
      ) {

        calculatorFractionNumber(
          digit
        );

        return;

      }


      if (
        calculatorState.justCalculated
      ) {

        calculatorResetExpression();

      }


      if (
        calculatorState.waitingForOperand
      ) {

        calculatorState.currentInput =
          digit;

        calculatorState.waitingForOperand =
          false;

      } else {

        if (
          calculatorState.currentInput ===
          '0'
        ) {

          calculatorState.currentInput =
            digit;

        } else {

          calculatorState.currentInput +=
            digit;

        }

      }


      updateCalculatorDisplay();

    }


    function calculatorDecimal() {

      if (
        fractionInputMode !== 0
      ) {

        return;

      }


      if (
        calculatorState.justCalculated
      ) {

        calculatorResetExpression();

      }


      if (
        calculatorState.waitingForOperand
      ) {

        calculatorState.currentInput =
          '0.';

        calculatorState.waitingForOperand =
          false;

      } else if (
        !calculatorState.currentInput
          .includes('.')
      ) {

        calculatorState.currentInput +=
          '.';

      }


      updateCalculatorDisplay();

    }


    function calculatorFractionStep() {

      /*
       * 0 → 1
       * 1 → 2
       * 2 → 3
       * 3 → 0
       */
      if (
        fractionInputMode === 0
      ) {

        if (
          calculatorState.justCalculated
        ) {

          calculatorResetExpression();

        }


        /*
         * 現在の通常入力を
         * 新しい帯分数の整数部分にする。
         */
        fractionBuffer.integer =
          calculatorState.currentInput ===
            '0'
              ? ''
              : calculatorState.currentInput;

        fractionBuffer.denominator =
          '';

        fractionBuffer.numerator =
          '';

        fractionInputMode =
          1;


        calculatorState.currentInput =
          '0';

      } else if (
        fractionInputMode === 1
      ) {

        fractionInputMode =
          2;

      } else if (
        fractionInputMode === 2
      ) {

        fractionInputMode =
          3;

      } else {

        finishFractionInput();

      }


      updateCalculatorDisplay();

      updateFractionStatus();

    }


    function calculatorFractionNumber(
      digit
    ) {

      if (
        fractionInputMode === 1
      ) {

        fractionBuffer.integer +=
          digit;

      } else if (
        fractionInputMode === 2
      ) {

        fractionBuffer.denominator +=
          digit;

      } else if (
        fractionInputMode === 3
      ) {

        fractionBuffer.numerator +=
          digit;

      }


      updateCalculatorDisplay();

      updateFractionStatus();

    }


    function finishFractionInput() {

      try {

        const fraction =
          fractionInputToFraction();


        /*
         * 帯分数を仮分数として
         * 正規化済み状態にする。
         * これにより分数部分の
         * 約分・仮分数化を自動処理。
         */

        calculatorState.currentInput =
          formatBigFraction(
            fraction
          ).text;


        fractionInputMode =
          0;


        fractionBuffer = {
          integer: '',
          denominator: '',
          numerator: ''
        };


        calculatorState.waitingForOperand =
          false;

      } catch (error) {

        calculatorState.currentInput =
          'Error';

        fractionInputMode =
          0;

        fractionBuffer = {
          integer: '',
          denominator: '',
          numerator: ''
        };

      }


      updateCalculatorDisplay();

      updateFractionStatus();

    }


    function calculatorOperator(
      operator
    ) {

      try {

        if (
          calculatorState.currentInput ===
          'Error'
        ) {

          calculatorClear();

        }


        /*
         * 分数入力中なら終了。
         */
        if (
          fractionInputMode !== 0
        ) {

          finishFractionInput();

        }


        const current =
          getCurrentCalculatorValue();


        if (
          calculatorState.expression.length ===
          0
        ) {

          calculatorState.expression.push(
            {
              type: 'value',
              value: current
            }
          );

        } else if (
          calculatorState.expression[
            calculatorState.expression.length - 1
          ].type === 'operator'
        ) {

          calculatorState.expression[
            calculatorState.expression.length - 1
          ].value =
            operator;

        } else {

          calculatorState.expression.push(
            {
              type:
                'value',

              value:
                current
            }
          );

        }


        calculatorState.expression.push(
          {
            type:
              'operator',

            value:
              operator
          }
        );


        calculatorState.currentInput =
          '0';

        calculatorState.waitingForOperand =
          true;

        calculatorState.justCalculated =
          false;


        updateCalculatorDisplay();

      } catch (error) {

        calculatorShowError(
          error.message
        );

      }

    }


    function calculatorEquals() {

      try {

        if (
          fractionInputMode !== 0
        ) {

          finishFractionInput();

        }


        const current =
          getCurrentCalculatorValue();


        if (
          calculatorState.expression.length ===
          0
        ) {

          const result =
            formatBigFraction(
              current
            );


          calculatorState.currentInput =
            result.text;

          calculatorState.justCalculated =
            true;

          updateCalculatorDisplay();

          return;

        }


        let expression =
          [
            ...calculatorState.expression
          ];


        if (
          expression.length === 0 ||
          expression[
            expression.length - 1
          ].type ===
            'operator'
        ) {

          expression.push({
            type:
              'value',

            value:
              current
          });

        } else {

          expression.push({
            type:
              'value',

            value:
              current
          });

        }


        const result =
          evaluateCalculatorExpression(
            expression
          );


        calculatorState.expression =
          [];


        calculatorState.currentInput =
          formatBigFraction(
            result
          ).text;


        calculatorState.justCalculated =
          true;

        calculatorState.waitingForOperand =
          false;


        updateCalculatorDisplay();

        updateFractionStatus();

      } catch (error) {

        calculatorShowError(
          error.message
        );

      }

    }


    function evaluateCalculatorExpression(
      expression
    ) {

      /*
       * 先に × と ÷ を計算。
       */
      const values = [];
      const operators = [];


      let current =
        expression[0].value;


      for (
        let i = 1;
        i <
          expression.length;
        i += 2
      ) {

        const operator =
          expression[i].value;

        const next =
          expression[i + 1]
            .value;


        if (
          operator === '×'
        ) {

          current =
            multiplyFractions(
              current,
              next
            );

        } else if (
          operator === '÷'
        ) {

          current =
            divideFractions(
              current,
              next
            );

        } else {

          values.push(
            current
          );

          operators.push(
            operator
          );

          current =
            next;

        }

      }


      values.push(
        current
      );


      let result =
        values[0];


      for (
        let i = 0;
        i <
          operators.length;
        i++
      ) {

        if (
          operators[i] === '+'
        ) {

          result =
            addFractions(
              result,
              values[i + 1]
            );

        } else if (
          operators[i] === '−'
        ) {

          result =
            subtractFractions(
              result,
              values[i + 1]
            );

        }

      }


      return normalizeFraction(
        result.n,
        result.d
      );

    }


    function calculatorShowError(
      message
    ) {

      document.getElementById(
        'calculatorMainDisplay'
      ).innerHTML =
        `
        <span class="calculator-error">
          ${sanitizeHTML(
            message ||
            getTexts().calculatorError
          )}
        </span>
        `;


      calculatorState.expression =
        [];

      calculatorState.currentInput =
        '0';

      calculatorState.waitingForOperand =
        false;

      calculatorState.justCalculated =
        true;

      fractionInputMode =
        0;

      fractionBuffer = {
        integer: '',
        denominator: '',
        numerator: ''
      };


      updateFractionStatus();

    }


    function calculatorBackspace() {

      if (
        fractionInputMode === 1
      ) {

        fractionBuffer.integer =
          fractionBuffer.integer.slice(
            0,
            -1
          );

      } else if (
        fractionInputMode === 2
      ) {

        fractionBuffer.denominator =
          fractionBuffer.denominator.slice(
            0,
            -1
          );

      } else if (
        fractionInputMode === 3
      ) {

        fractionBuffer.numerator =
          fractionBuffer.numerator.slice(
            0,
            -1
          );

      } else {

        if (
          calculatorState.currentInput.length >
          1
        ) {

          calculatorState.currentInput =
            calculatorState.currentInput.slice(
              0,
              -1
            );

        } else {

          calculatorState.currentInput =
            '0';

        }

      }


      updateCalculatorDisplay();

      updateFractionStatus();

    }


    function updateCalculatorDisplay() {

      const expressionDiv =
        document.getElementById(
          'calculatorExpression'
        );


      const displayDiv =
        document.getElementById(
          'calculatorMainDisplay'
        );


      if (
        fractionInputMode !== 0
      ) {

        expressionDiv.textContent =
          getFractionModeLabel();


        const preview =
          buildFractionPreviewHTML();


        displayDiv.innerHTML =
          preview;

        return;

      }


      let expressionText =
        '';


      calculatorState.expression.forEach(
        token => {

          if (
            token.type ===
            'operator'
          ) {

            expressionText +=
              ` ${token.value} `;

          } else {

            expressionText +=
              formatBigFraction(
                token.value
              ).text;

          }

        }
      );


      expressionDiv.textContent =
        expressionText ||
        '0';


      if (
        calculatorState.currentInput ===
        'Error'
      ) {

        displayDiv.innerHTML =
          `
          <span class="calculator-error">
            ${sanitizeHTML(
              getTexts().calculatorError
            )}
          </span>
          `;

        return;

      }


      /*
       * currentInput が通常の帯分数表示の場合は
       * 内部値へ戻してからHTML表示する。
       */
      try {

        const fraction =
          parseDisplayTextToFraction(
            calculatorState.currentInput
          );


        displayDiv.innerHTML =
          formatBigFraction(
            fraction
          ).html;

      } catch (e) {

        displayDiv.textContent =
          calculatorState.currentInput;

      }

    }


    function parseDisplayTextToFraction(
      text
    ) {

      const clean =
        String(text)
          .trim();


      if (
        clean.includes(' ')
      ) {

        const parts =
          clean.split(
            /\s+/
          );


        if (
          parts.length === 2 &&
          parts[1].includes('/')
        ) {

          const integer =
            BigInt(parts[0]);

          const frac =
            parts[1].split('/');

          const n =
            BigInt(frac[0]);

          const d =
            BigInt(frac[1]);


          return parseMixedFraction(
            integer.toString(),
            n.toString(),
            d.toString()
          );

        }

      }


      if (
        clean.includes('/')
      ) {

        const parts =
          clean.split('/');


        if (
          parts.length === 2
        ) {

          return normalizeFraction(
            BigInt(parts[0]),
            BigInt(parts[1])
          );

        }

      }


      return parseDecimalToFraction(
        clean
      );

    }


    function getFractionModeLabel() {

      const texts =
        getTexts();


      if (
        fractionInputMode === 1
      ) {

        return texts.fractionInteger;

      }


      if (
        fractionInputMode === 2
      ) {

        return texts.fractionDenominator;

      }


      if (
        fractionInputMode === 3
      ) {

        return texts.fractionNumerator;

      }


      return texts.fractionFinished;

    }


    function buildFractionPreviewHTML() {

      let integer =
        fractionBuffer.integer;


      let denominator =
        fractionBuffer.denominator;


      let numerator =
        fractionBuffer.numerator;


      if (
        !integer
      ) {

        integer =
          '0';

      }


      if (
        !denominator
      ) {

        denominator =
          '?';

      }


      if (
        !numerator
      ) {

        numerator =
          '?';

      }


      let integerHtml =
        '';


      if (
        integer !== '0' ||
        fractionInputMode === 1
      ) {

        integerHtml =
          `
          <span class="mixed-number-integer">
            ${sanitizeHTML(integer)}
          </span>
          `;

      }


      return `
        <span class="mixed-number-preview">
          ${integerHtml}

          <span class="fraction-preview-stack">

            <span class="fraction-preview-numerator">
              ${sanitizeHTML(numerator)}
            </span>

            <span class="fraction-preview-denominator">
              ${sanitizeHTML(denominator)}
            </span>

          </span>
        </span>
        `;

    }


    function updateFractionStatus() {

      const status =
        document.getElementById(
          'fractionStatusText'
        );


      const preview =
        document.getElementById(
          'fractionPreview'
        );


      status.textContent =
        fractionInputMode === 0
          ? getTexts().calculatorNormal
          : getFractionModeLabel();


      if (
        fractionInputMode === 0
      ) {

        preview.innerHTML =
          '';

        return;

      }


      preview.innerHTML =
        buildFractionPreviewHTML();

    }


    function updateCalculatorLanguage() {

      const help =
        document.getElementById(
          'calculatorHelp'
        );


      help.innerHTML =
        `
        <strong>
          ${sanitizeHTML(
            getTexts().calculatorHelpTitle
          )}
        </strong>

        <br><br>

        ${getTexts().calculatorHelpText}
        `;


      updateCalculatorDisplay();

      updateFractionStatus();

    }


    function toggleCalculatorHelp() {

      const help =
        document.getElementById(
          'calculatorHelp'
        );


      help.classList.toggle(
        'show'
      );

    }


    /* =========================
       Language Panel Outside Click
       ========================= */

    document.addEventListener(
      'click',
      (event) => {

        const wrap =
          document.querySelector(
            '.language-menu-wrap'
          );


        const panel =
          document.getElementById(
            'languagePanel'
          );


        if (
          wrap &&
          panel &&
          !wrap.contains(event.target)
        ) {

          panel.classList.remove(
            'show'
          );

        }

      }
    );

  </script>
