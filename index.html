<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEARCH AI Pro2.0</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-main: #050816;
      --bg-panel: rgba(8, 15, 38, 0.82);
      --neon-cyan: #00eaff;
      --neon-purple: #9b5cff;
      --neon-pink: #ff3cac;
      --neon-blue: #4d7cff;
      --text-main: #eef7ff;
      --text-sub: #9eb2cc;
      --border: rgba(114, 170, 255, 0.22);

      --shadow-cyan:
        0 0 10px rgba(0, 234, 255, 0.35),
        0 0 30px rgba(0, 234, 255, 0.14);

      --shadow-purple:
        0 0 10px rgba(155, 92, 255, 0.35),
        0 0 30px rgba(155, 92, 255, 0.14);
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(0, 234, 255, 0.10),
          transparent 22%
        ),
        radial-gradient(
          circle at 85% 15%,
          rgba(155, 92, 255, 0.13),
          transparent 24%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(255, 60, 172, 0.09),
          transparent 22%
        ),
        linear-gradient(
          135deg,
          #03050d 0%,
          #071025 45%,
          #050816 100%
        );

      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;

      background-image:
        radial-gradient(circle, rgba(255,255,255,0.85) 0.7px, transparent 0.9px),
        radial-gradient(circle, rgba(0,234,255,0.75) 0.8px, transparent 1px),
        radial-gradient(circle, rgba(155,92,255,0.75) 0.7px, transparent 1px);

      background-size:
        150px 150px,
        230px 230px,
        310px 310px;

      background-position:
        15px 10px,
        90px 45px,
        25px 120px;

      opacity: 0.42;
    }

    /* =========================
       Sidebar
       ========================= */

    #sidebar {
      width: 290px;

      background:
        linear-gradient(
          180deg,
          rgba(4, 10, 28, 0.96),
          rgba(8, 11, 32, 0.93)
        );

      border-right:
        1px solid rgba(0, 234, 255, 0.20);

      display: flex;
      flex-direction: column;

      transition:
        margin-left 0.25s cubic-bezier(0.4, 0, 0.2, 1);

      z-index: 100;

      box-shadow:
        8px 0 30px rgba(0, 0, 0, 0.35),
        0 0 25px rgba(0, 234, 255, 0.05);
    }

    #sidebar.collapsed {
      margin-left: -290px;
    }

    .sidebar-header {
      padding: 12px 14px;

      min-height: 58px;

      border-bottom:
        1px solid rgba(0, 234, 255, 0.14);

      display: flex;
      justify-content: flex-start;
      align-items: center;

      gap: 10px;

      background:
        linear-gradient(
          90deg,
          rgba(0,234,255,0.04),
          rgba(155,92,255,0.06)
        );
    }

    .sidebar-header h3 {
      font-size: 0.96rem;
      color: #dffaff;
      font-weight: 700;

      text-shadow:
        0 0 8px rgba(0, 234, 255, 0.35);

      flex: 1;
    }

    .sidebar-header .toggle-sidebar-btn {
      flex-shrink: 0;
    }

    .new-chat-btn {
      margin: 14px 16px;

      padding: 11px 14px;

      background:
        linear-gradient(
          90deg,
          rgba(0,234,255,0.20),
          rgba(155,92,255,0.22)
        );

      color: #ffffff;

      border:
        1px solid rgba(0,234,255,0.55);

      border-radius: 10px;

      font-weight: 700;
      font-size: 0.9rem;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 6px;

      box-shadow: var(--shadow-cyan);

      transition:
        transform 0.2s,
        box-shadow 0.2s;
    }

    .new-chat-btn:hover {
      transform: translateY(-1px);

      box-shadow:
        0 0 12px rgba(0,234,255,0.55),
        0 0 35px rgba(155,92,255,0.22);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;

      padding: 0 12px 14px;

      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-list::-webkit-scrollbar,
    main::-webkit-scrollbar,
    .saved-list::-webkit-scrollbar,
    .tab-content::-webkit-scrollbar,
    .calculator-area::-webkit-scrollbar {
      width: 7px;
    }

    .history-list::-webkit-scrollbar-thumb,
    main::-webkit-scrollbar-thumb,
    .saved-list::-webkit-scrollbar-thumb,
    .tab-content::-webkit-scrollbar-thumb,
    .calculator-area::-webkit-scrollbar-thumb {
      background:
        linear-gradient(
          180deg,
          rgba(0,234,255,0.30),
          rgba(155,92,255,0.30)
        );

      border-radius: 10px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 10px 11px;

      border-radius: 9px;

      background: rgba(255,255,255,0.015);

      border:
        1px solid transparent;

      cursor: pointer;

      color: #b9c9df;

      transition:
        background 0.18s,
        border-color 0.18s,
        transform 0.18s;
    }

    .history-item:hover {
      background:
        rgba(0,234,255,0.07);

      border-color:
        rgba(0,234,255,0.16);

      transform: translateX(2px);
    }

    .history-item.active {
      background:
        linear-gradient(
          90deg,
          rgba(0,234,255,0.11),
          rgba(155,92,255,0.10)
        );

      border-color:
        rgba(0,234,255,0.32);

      color: #ffffff;

      box-shadow:
        inset 0 0 18px rgba(0,234,255,0.04);
    }

    .history-item.pinned {
      border-color:
        rgba(255,60,172,0.28);

      background:
        linear-gradient(
          90deg,
          rgba(255,60,172,0.08),
          rgba(155,92,255,0.07)
        );
    }

    .history-item-title {
      font-size: 0.88rem;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      flex: 1;
      min-width: 0;

      padding-right: 8px;
    }

    .history-action-btns {
      display: flex;
      gap: 3px;

      opacity: 0.72;
      flex-shrink: 0;
    }

    .history-item:hover .history-action-btns {
      opacity: 1;
    }

    .history-btn {
      border: none;
      background: transparent;

      color: #88a0bd;

      font-size: 0.82rem;

      cursor: pointer;

      padding: 4px 5px;

      border-radius: 5px;

      transition:
        background 0.18s,
        color 0.18s;
    }

    .history-btn:hover {
      background:
        rgba(0,234,255,0.09);

      color: #ffffff;
    }

    .history-btn.pin-btn.active {
      color: #ff3cac;

      text-shadow:
        0 0 8px rgba(255,60,172,0.7);
    }

    .history-btn.del-btn:hover {
      background:
        rgba(255, 70, 110, 0.12);

      color: #ff6b8a;
    }

    /* =========================
       Main
       ========================= */

    .main-wrapper {
      flex: 1;

      display: flex;
      flex-direction: column;

      height: 100vh;
      overflow: hidden;

      position: relative;
      z-index: 1;
    }

    header {
      background:
        linear-gradient(
          90deg,
          rgba(3,8,22,0.88),
          rgba(8,14,35,0.88)
        );

      backdrop-filter: blur(18px);

      color: #ffffff;

      padding: 12px 20px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-bottom:
        1px solid rgba(0,234,255,0.18);

      box-shadow:
        0 5px 30px rgba(0,0,0,0.22);

      z-index: 10;

      position: relative;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;

      min-width: 0;
    }

    .toggle-sidebar-btn {
      background:
        rgba(255,255,255,0.045);

      color: #dffaff;

      border:
        1px solid rgba(0,234,255,0.35);

      padding: 7px 12px;

      border-radius: 8px;

      cursor: pointer;

      font-size: 0.86rem;
      font-weight: 700;

      transition: all 0.2s;

      box-shadow:
        0 0 8px rgba(0,234,255,0.08);

      white-space: nowrap;
    }

    .toggle-sidebar-btn:hover {
      background:
        rgba(0,234,255,0.09);

      border-color:
        rgba(0,234,255,0.75);

      box-shadow:
        0 0 12px rgba(0,234,255,0.26);

      color: #ffffff;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 800;

      color: #ffffff;

      letter-spacing: 0.4px;

      text-shadow:
        0 0 8px rgba(0,234,255,0.42),
        0 0 18px rgba(155,92,255,0.22);

      white-space: nowrap;
    }

    .header-btns {
      display: flex;
      gap: 9px;
      align-items: center;
      flex-wrap: wrap;
      position: relative;
    }

    .toggle-label {
      font-size: 0.83rem;

      color: #d6e7ff;

      display: flex;
      align-items: center;

      gap: 5px;

      cursor: pointer;
      font-weight: 600;
    }

    .toggle-label input {
      accent-color: var(--neon-cyan);
    }

    .btn {
      background:
        rgba(255,255,255,0.045);

      color: #d6e7ff;

      border:
        1px solid rgba(140,180,255,0.20);

      padding: 7px 13px;

      border-radius: 8px;

      font-weight: 650;

      cursor: pointer;

      transition: all 0.2s;

      font-size: 0.84rem;
    }

    .btn:hover {
      background:
        rgba(0,234,255,0.08);

      border-color:
        rgba(0,234,255,0.45);

      color: #ffffff;

      box-shadow:
        0 0 10px rgba(0,234,255,0.15);
    }

    /* =========================
       Header Language
       ========================= */

    .language-menu-wrap {
      position: relative;
    }

    .language-btn {
      background:
        linear-gradient(
          135deg,
          rgba(0,234,255,0.14),
          rgba(155,92,255,0.14)
        );

      border:
        1px solid rgba(0,234,255,0.36);

      color: #dffaff;

      padding: 7px 13px;

      border-radius: 8px;

      font-weight: 700;

      cursor: pointer;

      transition: all 0.2s;

      font-size: 0.84rem;

      white-space: nowrap;
    }

    .language-btn:hover {
      background:
        linear-gradient(
          135deg,
          rgba(0,234,255,0.22),
          rgba(155,92,255,0.22)
        );

      border-color:
        rgba(0,234,255,0.70);

      box-shadow:
        0 0 12px rgba(0,234,255,0.16);
    }

    .language-panel {
      display: none;

      position: absolute;

      top: calc(100% + 10px);

      right: 0;

      width: 255px;

      padding: 13px;

      border:
        1px solid rgba(0,234,255,0.28);

      border-radius: 12px;

      background:
        linear-gradient(
          145deg,
          rgba(7,14,34,0.98),
          rgba(12,12,41,0.98)
        );

      box-shadow:
        0 0 18px rgba(0,234,255,0.14),
        0 0 35px rgba(155,92,255,0.10),
        0 18px 45px rgba(0,0,0,0.38);

      backdrop-filter: blur(18px);

      z-index: 5000;
    }

    .language-panel.show {
      display: block;
    }

    .language-panel-title {
      font-size: 0.82rem;

      color: #90efff;

      font-weight: 700;

      margin-bottom: 10px;
    }

    .language-options {
      display: flex;

      gap: 8px;

      flex-wrap: wrap;
    }

    .language-option {
      padding: 7px 11px;

      border-radius: 7px;

      background:
        rgba(255,255,255,0.045);

      border:
        1px solid rgba(140,180,255,0.22);

      color: #cfe7ff;

      cursor: pointer;

      font-weight: 600;

      transition: all 0.2s;
    }

    .language-option:hover,
    .language-option.active {
      border-color:
        rgba(0,234,255,0.65);

      background:
        rgba(0,234,255,0.10);

      color: #ffffff;

      box-shadow:
        0 0 10px rgba(0,234,255,0.14);
    }

    /* =========================
       Chat
       ========================= */

    main {
      flex: 1;

      padding: 22px;

      overflow-y: auto;

      display: flex;
      flex-direction: column;
      gap: 18px;

      max-width: 900px;
      width: 100%;

      margin: 0 auto;

      scroll-behavior: smooth;
    }

    .message {
      padding: 15px 18px;

      border-radius: 14px;

      max-width: 86%;

      line-height: 1.65;

      word-break: break-word;

      font-size: 0.95rem;
    }

    .user-msg {
      background:
        linear-gradient(
          135deg,
          rgba(0,234,255,0.18),
          rgba(77,124,255,0.22)
        );

      color: #ffffff;

      align-self: flex-end;

      border:
        1px solid rgba(0,234,255,0.38);

      border-bottom-right-radius: 4px;

      box-shadow:
        var(--shadow-cyan);

      backdrop-filter: blur(12px);
    }

    .ai-msg {
      background:
        linear-gradient(
          145deg,
          rgba(11,18,43,0.88),
          rgba(7,14,31,0.88)
        );

      color: #e7f0ff;

      align-self: flex-start;

      border-bottom-left-radius: 4px;

      border:
        1px solid rgba(155,92,255,0.22);

      box-shadow:
        0 0 16px rgba(155,92,255,0.07),
        0 10px 35px rgba(0,0,0,0.25);

      width: 100%;

      backdrop-filter: blur(14px);
    }

    .speech-btn {
      background:
        rgba(255,255,255,0.04);

      border:
        1px solid rgba(0,234,255,0.24);

      padding: 5px 10px;

      border-radius: 7px;

      font-size: 0.79rem;

      cursor: pointer;

      color: #cbeeff;

      transition: all 0.2s;
    }

    .speech-btn:hover {
      background:
        rgba(0,234,255,0.08);

      border-color:
        rgba(0,234,255,0.52);

      box-shadow:
        0 0 10px rgba(0,234,255,0.15);

      color: #ffffff;
    }

    .speech-btn.stop-btn {
      background:
        rgba(255,60,100,0.06);

      border-color:
        rgba(255,90,125,0.28);

      color: #ff9ab0;
    }

    /* =========================
       Footer
       ========================= */

    footer {
      padding: 15px 20px;

      background:
        rgba(4,9,25,0.82);

      backdrop-filter: blur(18px);

      border-top:
        1px solid rgba(0,234,255,0.15);

      box-shadow:
        0 -5px 25px rgba(0,0,0,0.22);
    }

    .input-box {
      max-width: 900px;

      margin: 0 auto;

      display: flex;

      gap: 9px;

      align-items: stretch;
    }

    textarea {
      flex: 1;

      height: 54px;

      padding: 13px;

      background:
        rgba(255,255,255,0.045);

      color: #f3f8ff;

      border:
        1px solid rgba(0,234,255,0.22);

      border-radius: 10px;

      resize: none;

      font-size: 0.95rem;

      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s,
        background 0.2s;
    }

    textarea::placeholder {
      color: #6f87a4;
    }

    textarea:focus {
      border-color:
        rgba(0,234,255,0.65);

      background:
        rgba(0,234,255,0.035);

      box-shadow:
        0 0 0 3px rgba(0,234,255,0.08),
        0 0 16px rgba(0,234,255,0.10);
    }

    .voice-btn {
      min-width: 54px;

      border-radius: 10px;

      background:
        rgba(155,92,255,0.10);

      color: #d9c8ff;

      border:
        1px solid rgba(155,92,255,0.35);

      cursor: pointer;

      font-size: 1.15rem;

      transition: all 0.2s;

      flex-shrink: 0;
    }

    .voice-btn:hover {
      background:
        rgba(155,92,255,0.18);

      border-color:
        rgba(155,92,255,0.7);

      box-shadow:
        0 0 12px rgba(155,92,255,0.22);
    }

    .voice-btn.listening {
      background:
        rgba(255,60,172,0.16);

      border-color:
        rgba(255,60,172,0.72);

      color: #ff8ac8;

      box-shadow:
        0 0 14px rgba(255,60,172,0.35),
        0 0 35px rgba(255,60,172,0.12);

      animation:
        voicePulse 1s infinite;
    }

    @keyframes voicePulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.04);
      }
    }

    .send-btn {
      background:
        linear-gradient(
          135deg,
          rgba(0,234,255,0.75),
          rgba(77,124,255,0.82)
        );

      color: #ffffff;

      border:
        1px solid rgba(0,234,255,0.82);

      padding: 0 23px;

      border-radius: 10px;

      font-weight: 750;

      cursor: pointer;

      transition: all 0.2s;

      box-shadow:
        0 0 13px rgba(0,234,255,0.24);
    }

    .send-btn:hover {
      transform: translateY(-1px);

      box-shadow:
        0 0 18px rgba(0,234,255,0.40),
        0 0 30px rgba(155,92,255,0.15);
    }

    /* =========================
       Modal
       ========================= */

    .modal {
      display: none;

      position: fixed;

      inset: 0;

      background:
        rgba(1,4,15,0.76);

      backdrop-filter: blur(10px);

      justify-content: center;
      align-items: center;

      z-index: 1000;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background:
        linear-gradient(
          145deg,
          rgba(7,14,34,0.97),
          rgba(12,12,41,0.97)
        );

      width: 90%;
      max-width: 920px;
      height: 85vh;

      border:
        1px solid rgba(0,234,255,0.22);

      border-radius: 15px;

      padding: 20px;

      display: flex;
      flex-direction: column;

      position: relative;

      box-shadow:
        0 0 30px rgba(0,234,255,0.10),
        0 0 50px rgba(155,92,255,0.08),
        0 20px 70px rgba(0,0,0,0.42);

      backdrop-filter: blur(18px);
    }

    .close-btn {
      position: absolute;

      top: 10px;
      right: 14px;

      font-size: 1.6rem;

      border: none;

      background: transparent;

      cursor: pointer;

      color: #6f86a5;

      z-index: 2;
    }

    .close-btn:hover {
      color: #ffffff;
    }

    /* =========================
       Feature Menu
       ========================= */

    .tab-bar {
      display: flex;

      gap: 12px;

      border-bottom:
        1px solid rgba(0,234,255,0.12);

      margin-bottom: 16px;

      overflow-x: auto;
      padding-right: 40px;
    }

    .tab-btn {
      padding: 10px 16px;

      border: none;

      background: transparent;

      font-size: 0.95rem;
      font-weight: 700;

      cursor: pointer;

      color: #6e85a3;

      border-bottom:
        2px solid transparent;

      margin-bottom: -1px;

      white-space: nowrap;
    }

    .tab-btn.active {
      color: #ffffff;

      border-bottom-color:
        var(--neon-cyan);

      text-shadow:
        0 0 8px rgba(0,234,255,0.55);
    }

    .tab-content {
      display: none;

      flex: 1;

      flex-direction: column;

      gap: 12px;

      overflow-y: auto;

      min-height: 0;
    }

    .tab-content.active {
      display: flex;
    }

    /* =========================
       Memo
       ========================= */

    .memo-split-container {
      display: flex;

      gap: 15px;

      flex: 1;

      min-height: 0;
    }

    .memo-left-panel,
    .memo-right-panel {
      flex: 1;

      display: flex;
      flex-direction: column;

      gap: 10px;

      border:
        1px solid rgba(0,234,255,0.14);

      padding: 12px;

      border-radius: 10px;

      background:
        rgba(255,255,255,0.025);
    }

    .memo-panel-title {
      font-weight: bold;

      font-size: 0.95rem;

      color: #8fefff;

      display: flex;
      justify-content: space-between;
      align-items: center;

      text-shadow:
        0 0 8px rgba(0,234,255,0.25);
    }

    .memo-title-input {
      padding: 8px 10px;

      border-radius: 7px;

      font-size: 0.9rem;
      font-weight: bold;

      width: 100%;

      background:
        rgba(255,255,255,0.045);

      color: #eef7ff;

      border:
        1px solid rgba(0,234,255,0.18);

      outline: none;
    }

    .memo-editor {
      width: 100%;

      flex: 1;

      min-height: 200px;

      padding: 10px;

      border-radius: 8px;

      font-size: 0.95rem;

      line-height: 1.5;

      resize: none;

      outline: none;

      background:
        rgba(255,255,255,0.045);

      color: #eef7ff;

      border:
        1px solid rgba(0,234,255,0.18);
    }

    .memo-editor::placeholder,
    .doc-editor::placeholder,
    .trans-textarea::placeholder,
    .memo-title-input::placeholder,
    .doc-title-input::placeholder,
    .lang-search::placeholder {
      color: #6f87a4;
    }

    .editor-voice-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .editor-voice-row .editor-voice-target {
      flex: 1;
    }

    .editor-voice-btn {
      min-width: 52px;
      height: 42px;

      align-self: center;

      border-radius: 8px;

      background:
        rgba(155,92,255,0.09);

      border:
        1px solid rgba(155,92,255,0.35);

      color: #dccfff;

      cursor: pointer;

      font-size: 1.05rem;

      transition: all 0.2s;
    }

    .editor-voice-btn:hover {
      background:
        rgba(155,92,255,0.16);

      border-color:
        rgba(155,92,255,0.68);

      box-shadow:
        0 0 12px rgba(155,92,255,0.20);
    }

    .editor-voice-btn.listening {
      background:
        rgba(255,60,172,0.15);

      border-color:
        rgba(255,60,172,0.72);

      color: #ff8ac8;

      box-shadow:
        0 0 15px rgba(255,60,172,0.30);

      animation:
        voicePulse 1s infinite;
    }

    .memo-action-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .saved-list {
      display: flex;

      flex-direction: column;

      gap: 8px;

      overflow-y: auto;

      flex: 1;
    }

    .saved-item {
      display: flex;

      justify-content: space-between;
      align-items: center;

      padding: 10px;

      border:
        1px solid rgba(0,234,255,0.12);

      border-radius: 8px;

      background:
        rgba(255,255,255,0.03);
    }

    .saved-item-title {
      font-weight: bold;

      cursor: pointer;

      flex: 1;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      color: #dceeff;
    }

    /* =========================
       Document
       ========================= */

    .doc-header {
      display: flex;

      justify-content: space-between;
      align-items: center;

      background:
        rgba(255,255,255,0.025);

      padding: 8px 12px;

      border-radius: 8px;

      gap: 8px;
    }

    .doc-title-input {
      flex: 1;

      padding: 6px 10px;

      border-radius: 7px;

      font-size: 0.95rem;
      font-weight: bold;

      outline: none;

      background:
        rgba(255,255,255,0.045);

      color: #eef7ff;

      border:
        1px solid rgba(0,234,255,0.18);
    }

    .doc-actions {
      display: flex;

      gap: 6px;

      flex-wrap: wrap;
    }

    .doc-editor {
      width: 100%;

      flex: 1;

      min-height: 200px;

      padding: 12px;

      border-radius: 8px;

      font-size: 0.95rem;

      line-height: 1.6;

      resize: vertical;

      outline: none;

      background:
        rgba(255,255,255,0.045);

      color: #eef7ff;

      border:
        1px solid rgba(0,234,255,0.18);
    }

    /* =========================
       Translation
       ========================= */

    .lang-box {
      display: flex;
      gap: 8px;
    }

    .lang-search {
      flex: 1;

      padding: 9px 10px;

      border-radius: 8px;

      outline: none;

      background:
        #f8fbff;

      color: #18243a;

      border:
        1px solid rgba(0,234,255,0.32);

      font-weight: 500;
    }

    .lang-select {
      flex: 1;

      padding: 9px 10px;

      border-radius: 8px;

      outline: none;

      background:
        #ffffff;

      color: #172033;

      border:
        1px solid rgba(0,234,255,0.38);

      font-weight: 650;

      box-shadow:
        0 0 10px rgba(0,234,255,0.06);

      color-scheme: light;
    }

    .lang-select:hover,
    .lang-select:focus {
      border-color:
        rgba(0,234,255,0.75);

      box-shadow:
        0 0 12px rgba(0,234,255,0.14);
    }

    .lang-select option {
      background: #ffffff;
      color: #172033;
    }

    .trans-textarea {
      width: 100%;

      height: 120px;

      padding: 10px;

      border-radius: 8px;

      resize: vertical;

      outline: none;

      background:
        rgba(255,255,255,0.045);

      color: #eef7ff;

      border:
        1px solid rgba(0,234,255,0.18);
    }

    .trans-result {
      width: 100%;

      min-height: 90px;

      padding: 10px;

      background:
        rgba(255,255,255,0.025);

      border:
        1px solid rgba(0,234,255,0.12);

      border-radius: 8px;

      white-space: pre-wrap;

      word-break: break-word;

      color: #dcecff;
    }

    /* =========================
       Calculator
       ========================= */

    .calculator-area {
      display: flex;
      flex-direction: column;
      gap: 14px;

      overflow-y: auto;
      min-height: 0;

      padding: 2px 4px 8px;
    }

    .calculator-display {
      border:
        1px solid rgba(0,234,255,0.30);

      border-radius: 12px;

      padding: 14px;

      background:
        linear-gradient(
          145deg,
          rgba(0,234,255,0.05),
          rgba(155,92,255,0.07)
        );

      box-shadow:
        0 0 15px rgba(0,234,255,0.08);

      min-height: 118px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      gap: 8px;
    }

    .calculator-expression {
      min-height: 28px;

      color: #9eb2cc;

      font-size: 0.92rem;

      white-space: pre-wrap;

      word-break: break-word;
    }

    .calculator-main-display {
      min-height: 52px;

      display: flex;
      justify-content: flex-end;
      align-items: center;

      color: #ffffff;

      font-size: 2rem;

      font-weight: 800;

      text-align: right;

      word-break: break-word;

      text-shadow:
        0 0 12px rgba(0,234,255,0.35);

      overflow-x: auto;
    }

    .calculator-buttons {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 8px;
    }

    .calc-btn {
      min-height: 54px;

      border-radius: 10px;

      border:
        1px solid rgba(140,180,255,0.20);

      background:
        rgba(255,255,255,0.045);

      color: #e7f4ff;

      cursor: pointer;

      font-size: 1.05rem;

      font-weight: 750;

      transition: all 0.18s;

      box-shadow:
        0 0 8px rgba(0,234,255,0.03);
    }

    .calc-btn:hover {
      transform: translateY(-1px);

      background:
        rgba(0,234,255,0.10);

      border-color:
        rgba(0,234,255,0.50);

      box-shadow:
        0 0 12px rgba(0,234,255,0.15);
    }

    .calc-btn.operator {
      background:
        rgba(155,92,255,0.12);

      border-color:
        rgba(155,92,255,0.30);

      color: #dfcaff;
    }

    .calc-btn.equal {
      background:
        linear-gradient(
          135deg,
          rgba(0,234,255,0.70),
          rgba(77,124,255,0.80)
        );

      border-color:
        rgba(0,234,255,0.75);

      color: #ffffff;
    }

    .calc-btn.danger {
      background:
        rgba(255,60,100,0.08);

      border-color:
        rgba(255,90,125,0.28);

      color: #ffb0c0;
    }

    .calc-btn.fraction {
      background:
        linear-gradient(
          135deg,
          rgba(0,234,255,0.12),
          rgba(155,92,255,0.14)
        );

      border-color:
        rgba(0,234,255,0.36);

      color: #dffaff;
    }

    .calc-btn.help {
      background:
        rgba(255,255,255,0.055);

      border-color:
        rgba(255,255,255,0.18);
    }

    .fraction-status {
      min-height: 48px;

      padding: 9px 12px;

      border-radius: 9px;

      border:
        1px solid rgba(155,92,255,0.22);

      background:
        rgba(155,92,255,0.05);

      color: #d9caff;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      flex-wrap: wrap;
    }

    .fraction-status-text {
      font-size: 0.88rem;
      font-weight: 700;
    }

    .fraction-preview {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      color: #ffffff;
      font-weight: 800;
    }

    .fraction-preview-stack {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      min-width: 38px;

      line-height: 1.05;
    }

    .fraction-preview-numerator {
      border-bottom:
        2px solid #dffaff;

      padding: 0 5px 3px;
    }

    .fraction-preview-denominator {
      padding: 3px 5px 0;
    }

    .mixed-number-preview {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .mixed-number-integer {
      font-size: 1.05rem;
    }

    .calculator-help {
      display: none;

      padding: 14px;

      border:
        1px solid rgba(0,234,255,0.18);

      border-radius: 10px;

      background:
        rgba(0,234,255,0.035);

      color: #d7e9fb;

      line-height: 1.7;

      font-size: 0.88rem;
    }

    .calculator-help.show {
      display: block;
    }

    .calculator-help strong {
      color: #8fefff;
    }

    .calculator-error {
      color: #ff9db2;

      font-weight: 700;
    }

    .calculator-result-fraction {
      display: inline-flex;

      align-items: center;

      gap: 8px;
    }

    .result-mixed-integer {
      font-size: 1.55rem;
      font-weight: 800;
    }

    .result-fraction-stack {
      display: inline-flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      line-height: 1.0;
    }

    .result-fraction-numerator {
      border-bottom:
        3px solid #ffffff;

      padding:
        0 8px 5px;

      font-size: 1.25rem;
    }

    .result-fraction-denominator {
      padding:
        5px 8px 0;

      font-size: 1.25rem;
    }

    @media (max-width: 780px) {

      .header-btns {
        gap: 5px;
      }

      .toggle-label {
        display: none;
      }

      .memo-split-container {
        flex-direction: column;
      }

      .input-box {
        gap: 6px;
      }

      .send-btn {
        padding: 0 16px;
      }

      .message {
        max-width: 94%;
      }

      .lang-box {
        flex-direction: column;
      }

      .language-panel {
        right: -5px;
        width: min(255px, calc(100vw - 30px));
      }

      .sidebar-header {
        padding: 10px 12px;
      }

      .sidebar-header .toggle-sidebar-btn {
        padding: 6px 9px;
      }

      .calculator-buttons {
        gap: 6px;
      }

      .calc-btn {
        min-height: 49px;
        font-size: 0.96rem;
      }

      .calculator-main-display {
        font-size: 1.55rem;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       Sidebar
       ========================= -->

  <div id="sidebar" class="collapsed">

    <div class="sidebar-header">

      <button
        id="sidebarToggleBtn"
        class="toggle-sidebar-btn"
        onclick="toggleSidebar()"
        aria-label="履歴を開く"
        title="履歴を開く"
      >
        ⇒ 履歴
      </button>

      <h3 id="sidebarTitle">
        💬 会話履歴
      </h3>

    </div>

    <button
      class="new-chat-btn"
      onclick="createNewChat()"
      id="newChatBtn"
    >
      ＋ 新しいチャット
    </button>

    <div
      id="historyList"
      class="history-list"
    ></div>

  </div>


  <!-- =========================
       Main
       ========================= -->

  <div class="main-wrapper">

    <header>

      <div class="header-left">

        <h1 id="appTitle">
          SEARCH AI Pro2.0
        </h1>

      </div>


      <div class="header-btns">

        <!-- 通知 -->
        <label class="toggle-label">

          <input
            type="checkbox"
            id="notifyToggle"
            onchange="toggleNotificationSetting(this.checked)"
          >

          <span id="labelNotify">
            🔔 通知
          </span>

        </label>


        <!-- 検索 -->
        <label class="toggle-label">

          <input
            type="checkbox"
            id="searchMode"
          >

          <span id="labelSearch">
            🌐 検索
          </span>

        </label>


        <!-- Language -->
        <div class="language-menu-wrap">

          <button
            id="languageButton"
            class="language-btn"
            type="button"
            onclick="toggleLanguagePanel()"
          >
            🌐 Language
          </button>


          <div
            id="languagePanel"
            class="language-panel"
          >

            <div
              id="languagePanelTitle"
              class="language-panel-title"
            >
              🌐 言語設定
            </div>


            <div class="language-options">

              <button
                class="language-option"
                data-lang="ja"
                onclick="selectUiLanguage('ja')"
              >
                日本語
              </button>

              <button
                class="language-option"
                data-lang="en"
                onclick="selectUiLanguage('en')"
              >
                English
              </button>

              <button
                class="language-option"
                data-lang="zh"
                onclick="selectUiLanguage('zh')"
              >
                中文
              </button>

              <button
                class="language-option"
                data-lang="ko"
                onclick="selectUiLanguage('ko')"
              >
                한국어
              </button>

            </div>

          </div>

        </div>


        <!-- 機能 -->
        <button
          id="menuBtn"
          class="btn"
        >
          ⚡ <span id="labelFeature">機能</span>
        </button>

      </div>

    </header>


    <main id="chatLog"></main>


    <footer>

      <div class="input-box">

        <textarea
          id="promptInput"
          placeholder="メッセージを入力... (Enter: 送信 / Shift+Enter: 改行)"
        ></textarea>

        <button
          id="voiceBtn"
          class="voice-btn"
          title="音声入力"
          aria-label="音声入力"
        >
          🎙️
        </button>

        <button
          id="sendBtn"
          class="send-btn"
        >
          送信
        </button>

      </div>

    </footer>

  </div>


  <!-- =========================
       Feature Modal
       ========================= -->

  <div
    id="featureModal"
    class="modal"
  >

    <div class="modal-content">

      <button
        id="closeModal"
        class="close-btn"
        aria-label="閉じる"
      >
        &times;
      </button>


      <!-- Tabs -->
      <div class="tab-bar">

        <button
          class="tab-btn active"
          onclick="switchTab(event, 'memoTab')"
          id="tabMemo"
        >
          📝 メモ
        </button>

        <button
          class="tab-btn"
          onclick="switchTab(event, 'docTab')"
          id="tabDoc"
        >
          📄 ドキュメント
        </button>

        <button
          class="tab-btn"
          onclick="switchTab(event, 'transTab')"
          id="tabTrans"
        >
          🌐 翻訳
        </button>

        <button
          class="tab-btn"
          onclick="switchTab(event, 'calculatorTab')"
          id="tabCalculator"
        >
          🧮 電卓
        </button>

      </div>


      <!-- =====================
           Memo
           ===================== -->

      <div
        id="memoTab"
        class="tab-content active"
      >

        <div class="memo-split-container">

          <div class="memo-left-panel">

            <div
              class="memo-panel-title"
              id="memoEditTitle"
            >
              ✍️ メモ編集・作成
            </div>

            <input
              type="text"
              id="memoTitleInput"
              class="memo-title-input"
              placeholder="タイトルを入力..."
            >

            <div class="editor-voice-row">

              <textarea
                id="memoEditor"
                class="memo-editor editor-voice-target"
                placeholder="ここにメモや要約を入力・編集..."
              ></textarea>

              <button
                id="memoVoiceBtn"
                class="editor-voice-btn"
                type="button"
                title="メモに音声入力"
                onclick="toggleFieldVoice('memoEditor', this)"
              >
                🎙️
              </button>

            </div>

            <div class="memo-action-btns">

              <button
                class="btn"
                id="memoSaveBtn"
                style="
                  background:linear-gradient(
                    135deg,
                    rgba(0,234,255,0.35),
                    rgba(77,124,255,0.35)
                  );
                  border-color:rgba(0,234,255,0.55);
                  color:white;
                "
                onclick="saveMemoItem()"
              >
                💾 保存 / 上書き
              </button>

              <button
                class="btn"
                id="memoDownloadBtn"
                onclick="downloadMemoTxt()"
              >
                📥 TXTダウンロード
              </button>

            </div>

          </div>


          <div class="memo-right-panel">

            <div
              class="memo-panel-title"
              id="memoListTitle"
            >
              📚 保存されたメモ一覧
            </div>

            <div
              id="memoSavedList"
              class="saved-list"
            ></div>

          </div>

        </div>

      </div>


      <!-- =====================
           Document
           ===================== -->

      <div
        id="docTab"
        class="tab-content"
      >

        <div class="doc-header">

          <input
            type="text"
            id="docTitle"
            class="doc-title-input"
            placeholder="タイトルを入力..."
          >

          <div class="doc-actions">

            <button
              class="btn"
              id="docListBtn"
              onclick="renderDocList()"
            >
              📂 リスト
            </button>

            <button
              class="btn"
              id="docSaveBtn"
              onclick="saveCurrentDoc()"
            >
              💾 保存
            </button>

            <button
              class="btn"
              id="docDownloadBtn"
              onclick="downloadTxt()"
            >
              📥 .txt
            </button>

          </div>

        </div>


        <div class="editor-voice-row">

          <textarea
            id="docEditor"
            class="doc-editor editor-voice-target"
            placeholder="ここにドキュメントを入力・編集..."
          ></textarea>

          <button
            id="docVoiceBtn"
            class="editor-voice-btn"
            type="button"
            title="ドキュメントに音声入力"
            onclick="toggleFieldVoice('docEditor', this)"
          >
            🎙️
          </button>

        </div>


        <div
          id="docListContainer"
          class="saved-list"
        ></div>

      </div>


      <!-- =====================
           Translation
           ===================== -->

      <div
        id="transTab"
        class="tab-content"
      >

        <div class="lang-box">

          <input
            type="text"
            id="langSearch"
            class="lang-search"
            placeholder="言語を検索..."
            oninput="filterLangs()"
          >

          <select
            id="langSelect"
            class="lang-select"
          >

            <option
              value="日本語"
              data-code="ja-JP"
            >
              日本語 (Japanese)
            </option>

            <option
              value="英語"
              data-code="en-US"
            >
              英語 (English)
            </option>

            <option
              value="中国語"
              data-code="zh-CN"
            >
              中国語 (Chinese)
            </option>

            <option
              value="韓国語"
              data-code="ko-KR"
            >
              韓国語 (Korean)
            </option>

            <option
              value="スペイン語"
              data-code="es-ES"
            >
              スペイン語 (Spanish)
            </option>

          </select>

        </div>


        <div class="editor-voice-row">

          <textarea
            id="transInput"
            class="trans-textarea editor-voice-target"
            placeholder="翻訳したいテキストを入力..."
          ></textarea>

          <button
            id="transVoiceBtn"
            class="editor-voice-btn"
            type="button"
            title="翻訳文に音声入力"
            onclick="toggleFieldVoice('transInput', this)"
          >
            🎙️
          </button>

        </div>


        <button
          id="btnTrans"
          class="btn"
          style="
            background:linear-gradient(
              135deg,
              rgba(0,234,255,0.35),
              rgba(77,124,255,0.35)
            );
            border-color:rgba(0,234,255,0.55);
            color:white;
            padding:8px;
          "
          onclick="runTranslation()"
        >
          翻訳実行
        </button>


        <div
          id="transResult"
          class="trans-result"
        >
          翻訳結果がここに表示されます
        </div>


        <div class="doc-actions">

          <button
            class="btn"
            id="transCopyBtn"
            onclick="copyTrans()"
          >
            📋 コピー
          </button>

          <button
            class="btn"
            id="transSpeakBtn"
            onclick="speakTranslation()"
          >
            🔊 読み上げ
          </button>

          <button
            class="btn speech-btn stop-btn"
            id="transStopBtn"
            onclick="stopSpeech()"
          >
            ⏹️ 停止
          </button>

        </div>

      </div>


      <!-- =====================
           Calculator
           ===================== -->

      <div
        id="calculatorTab"
        class="tab-content"
      >

        <div class="calculator-area">

          <div class="calculator-display">

            <div
              id="calculatorExpression"
              class="calculator-expression"
            >
              0
            </div>

            <div
              id="calculatorMainDisplay"
              class="calculator-main-display"
            >
              0
            </div>

          </div>


          <div
            id="fractionStatus"
            class="fraction-status"
          >

            <div
              id="fractionStatusText"
              class="fraction-status-text"
            >
              通常入力
            </div>

            <div
              id="fractionPreview"
              class="fraction-preview"
            >
            </div>

          </div>


          <div class="calculator-buttons">

            <button
              class="calc-btn danger"
              onclick="calculatorClear()"
            >
              C
            </button>

            <button
              class="calc-btn danger"
              onclick="calculatorBackspace()"
            >
              ⌫
            </button>

            <button
              class="calc-btn help"
              onclick="toggleCalculatorHelp()"
            >
              ?
            </button>

            <button
              class="calc-btn operator"
              onclick="calculatorOperator('÷')"
            >
              ÷
            </button>


            <button
              class="calc-btn"
              onclick="calculatorNumber('7')"
            >
              7
            </button>

            <button
              class="calc-btn"
              onclick="calculatorNumber('8')"
            >
              8
            </button>

    function selectUiLanguage(
      lang
    ) {

      if (
        !UI_TEXT[lang]
      ) return;

      stopFieldVoice();

      currentUiLang =
        lang;

      localStorage.setItem(
        'ui_lang',
        lang
      );

      applyUiLanguage();

      document
        .getElementById(
          'languagePanel'
        )
        .classList.remove(
          'show'
        );

    }

    function getSpeechLanguage() {

    function stopFieldVoice() {

      activeVoiceRunning =
        false;


      const oldButton =
        activeVoiceButton;

      const oldRecognition =
        fieldRecognition;


      activeVoiceTarget =
        null;

      activeVoiceButton =
        null;

      fieldRecognition =
        null;


      if (oldButton) {

        resetVoiceButton(
          oldButton
        );

      }


      if (oldRecognition) {

        try {

          oldRecognition.stop();

        } catch (e) {}

      }

    }


    function toggleFieldVoice(
      targetId,
      button
    ) {

      const texts =
        getTexts();


      if (!SpeechRecognition) {

        alert(
          texts.micUnsupported
        );

        return;

      }


      if (
        activeVoiceRunning &&
        activeVoiceButton === button
      ) {

        stopFieldVoice();

        return;

      }


      if (activeVoiceRunning) {

        stopFieldVoice();

      }


      const target =
        document.getElementById(
          targetId
        );


      if (!target)
        return;


      activeVoiceTarget =
        target;

      activeVoiceButton =
        button;

      activeVoiceRunning =
        true;


      button.classList.add(
        'listening'
      );

      button.textContent =
        '🔴';

      button.title =
        texts.voiceStop;


      const recognition =
        new SpeechRecognition();


      fieldRecognition =
        recognition;


      recognition.continuous =
        true;

      recognition.interimResults =
        true;

      recognition.lang =
        getSpeechLanguage();


      let interimText = '';


      recognition.onstart =
        () => {

          activeVoiceRunning =
            true;

        };


      recognition.onresult =
        (event) => {

          let finalText =
            '';

          interimText =
            '';


          for (
            let i =
              event.resultIndex;
            i <
              event.results.length;
            i++
          ) {

            const transcript =
              event.results[i][0]
                .transcript;


            if (
              event.results[i]
                .isFinal
            ) {

              finalText +=
                transcript;

            } else {

              interimText +=
                transcript;

            }

          }


          if (
            finalText &&
            activeVoiceTarget
          ) {

            activeVoiceTarget.value +=
              finalText;

          }


          if (
            activeVoiceButton
          ) {

            activeVoiceButton.title =
              interimText
                ? `認識中: ${interimText}`
                : texts.voiceStop;

          }

        };


      recognition.onerror =
        (event) => {

          console.error(
            '音声認識エラー:',
            event.error
          );


          if (
            event.error ===
              'not-allowed'
          ) {

            alert(
              texts.micDenied
            );

          }


          stopFieldVoice();

        };


      recognition.onend =
        () => {

          if (
            activeVoiceRunning &&
            activeVoiceTarget ===
              target &&
            fieldRecognition ===
              recognition
          ) {

            try {

              recognition.start();

            } catch (e) {}

          }

        };


      try {

        recognition.start();

      } catch (e) {

        console.error(e);

        stopFieldVoice();

      }

    }

    function autoSaveCurrentSession(
      sessionIdToSave,
      historyToSave

        getSavedSessions();


      let session =

              sessionIdToSave
        );


      const firstUserMsg =
        historyToSave.find(
          m =>
            m.role ===
            'user'
        )?.text ||
        '新しい会話';


      const title =
        firstUserMsg.length > 18
          ? firstUserMsg.substring(
              0,
              18
            ) + '...'
          : firstUserMsg;


      if (session) {

        session.history =
          historyToSave;


        if (!session.customTitle) {

          session.title =
            title;

        }


        session.date =
          new Date()
            .toLocaleString();

      } else {

        sessions.unshift({

          id:
            sessionIdToSave,

          title:
            title,

          customTitle:
            false,

          pinned:
            false,

          date:
            new Date()
              .toLocaleString(),

          history:
            historyToSave

      saveSessions(
        sessions

        (a, b) => {

            a.pinned ? 1 : 0;

          const pinB =
            b.pinned ? 1 : 0;


          if (
            pinA !== pinB
          ) {

            return pinB - pinA;

          }


          return 0;

        }
      );

        session => {

            document.createElement(
              'div'

                : ''

    async function processQueue() {

        apiQueue.length === 0

      isProcessingQueue =

      const task =
        apiQueue.shift();


      updateMsgStatus(
        task.sessionId,
        currentUiLang === 'en'
          ? '⏳ Generating answer...'
          : currentUiLang === 'zh'
            ? '⏳ 正在生成回答...'
            : currentUiLang === 'ko'
              ? '⏳ 답변 생성 중...'
              : '⏳ 回答を生成中...'
      );


      try {

        await processAiGeneration(
          task.sessionId,
          task.prompt
        );

      } catch (e) {

        console.error(e);

      } finally {

        isProcessingQueue =
          false;


        setTimeout(
          () => {
            processQueue();
          },
          500
        );

      }

    }

      let session =

      if (session) {

          session.history.find(
            m =>
              m.isGenerating

        if (targetMsg) {

          targetMsg.text =
            statusText;

        }


        saveSessions(
          sessions
        );

      }


      if (
        currentSessionId ===
        sessionId
      ) {

        let targetMsg =
          chatHistory.find(
            m =>
              m.isGenerating
          );


        if (targetMsg) {

          targetMsg.text =
            statusText;

        }


        renderChatLogUI();

      }

    }


    /* =========================
       AI Parse
       ========================= */

    function parseAiResponse(
      rawText
    ) {

      const text =
        String(
          rawText || ''
        ).trim();


      const summaryMatch =
        text.match(
          /【要約】\s*([\s\S]*?)(?=\s*【本文】|$)/
        );


      const bodyMatch =
        text.match(
          /【本文】\s*([\s\S]*)$/
        );


      if (
        summaryMatch &&
        bodyMatch
      ) {

        return {

          summary:
            summaryMatch[1].trim(),

          body:
            bodyMatch[1].trim()

        };

      }


      return {

        summary:
          '',

        body:
          text

      };

    }


    /* =========================

       ========================= */

    async function processAiGeneration(
      sessionId,
      prompt,
      retryCount = 0
    ) {

      try {

        const langInstruction =
          `【重要指示: 必ず「${
            UI_LANG_NAMES[
              currentUiLang
            ] || '日本語'
          }」で回答してください。】`;


        const structureInstruction = `

【回答形式】
必ず以下の形式で回答してください。

【要約】
ここには、【本文】で説明する内容全体を2〜4文程度で要約してください。
質問への別回答ではなく、本文全体の重要ポイントをまとめてください。
本文の冒頭部分をそのままコピーしないでください。

【本文】
ここには質問に対する詳しい回答を書いてください。
必要に応じて、理由・手順・例・注意点なども含めてください。

【重要】
・「【要約】」「【本文】」の見出しを必ず付ける
・要約は本文全体を読んだうえでまとめる
・要約と本文を同じ文章にしない
`;


        const fullPrompt =
          langInstruction +
          structureInstruction +
          '\n\nユーザーの質問:\n' +
          prompt;


        const res =
          await fetch(
            '/api/generate',
            {
              method:
                'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body:
                JSON.stringify({
                  prompt:
                    fullPrompt
                })
            }
          );


        if (
          res.status === 429
        ) {

          if (
            retryCount < 3
          ) {

            const retryDelaySec =
              25;


            updateMsgStatus(
              sessionId,
              `⏳ 制限超過のため待機中... (${retryDelaySec}秒後に自動再試行)`
            );


            await new Promise(
              resolve =>
                setTimeout(
                  resolve,
                  retryDelaySec *
                    1000
                )
            );


            return await processAiGeneration(
              sessionId,
              prompt,
              retryCount + 1
            );

          }


          throw new Error(
            '利用制限（クォータ）に達しました。しばらく時間をおいて再試行してください。'
          );

        }


        if (!res.ok) {

          const contentType =
            res.headers.get(
              'content-type'
            ) || '';


          let errorMsg =
            '';


          if (
            contentType.includes(
              'application/json'
            )
          ) {

            const errJson =
              await res.json();


            errorMsg =
              errJson.error?.message ||
              JSON.stringify(
                errJson
              );

          } else {

            errorMsg =
              await res.text();

          }


          throw new Error(
            `サーバーエラー (${res.status}): ${errorMsg}`
          );

        }


        const data =
          await res.json();


        const text =
          data.candidates?.[0]
            ?.content?.parts?.[0]
            ?.text ||
          JSON.stringify(
            data,
            null,
            2
          );


        const parsed =
          parseAiResponse(
            text
          );


        let sessions =
          getSavedSessions();


        let session =
          sessions.find(
            s =>
              s.id ===
              sessionId
          );


        if (session) {

          let targetMsg =
            session.history.find(
              m =>
                m.isGenerating
            );


          if (targetMsg) {

            targetMsg.text =
              parsed.body;

            targetMsg.summary =
              parsed.summary;

            delete targetMsg.isGenerating;

          }


          saveSessions(
            sessions
          );

        }


        if (
          currentSessionId ===
          sessionId
        ) {

          let targetMsg =
            chatHistory.find(
              m =>
                m.isGenerating
            );


          if (targetMsg) {

            targetMsg.text =
              parsed.body;

            targetMsg.summary =
              parsed.summary;

            delete targetMsg.isGenerating;

          }


          renderChatLogUI();

        }


        sendSystemNotification(
          currentUiLang === 'en'
            ? 'AI answer completed'
            : currentUiLang === 'zh'
              ? 'AI回答完成'
              : currentUiLang === 'ko'
                ? 'AI 답변이 완료되었습니다'
                : 'AI回答が完了しました',

          parsed.body.substring(
            0,
            40
          ) + '...'
        );


      } catch (err) {

        let sessions =
          getSavedSessions();


        let session =
          sessions.find(
            s =>
              s.id ===
              sessionId
          );


        if (session) {

          let targetMsg =
            session.history.find(
              m =>
                m.isGenerating
          );


          if (targetMsg) {

            targetMsg.text =
              'エラーが発生しました: ' +
              err.message;


            delete targetMsg.isGenerating;

          }


          saveSessions(
            sessions
          );

        }


        if (
          currentSessionId ===
          sessionId
        ) {

          renderChatLogUI();

        }

      }

    }

    /* =========================
       Speech Synthesis
       ========================= */

    function speakText(
      text,
      langCode = 'ja'
    ) {

      if (
        !('speechSynthesis' in window)
      ) return;


      window.speechSynthesis.cancel();


      const utterance =
        new SpeechSynthesisUtterance(
          text
        );


      const langMap = {

        ja:
          'ja-JP',

        en:
          'en-US',

        zh:
          'zh-CN',

        ko:
          'ko-KR'

      };


      utterance.lang =
        langMap[langCode] ||
        langCode ||
        'ja-JP';


      window.speechSynthesis.speak(
        utterance
      );

    }


    function stopSpeech() {

      if (
        'speechSynthesis' in window
      ) {

        window.speechSynthesis.cancel();

      }

    }

    async function fetchAiText(
      promptText

      try {

          await fetch(
            '/api/generate',
            {
              method:
                'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body:
                JSON.stringify({
                  prompt:
                    promptText
                })
            }
          );


        if (!res.ok) {

          return '（要約の生成に失敗しました）';

        }


        const data =
          await res.json();


        return (
          data.candidates?.[0]
            ?.content?.parts?.[0]
            ?.text ||
          '処理に失敗しました。'
        );


      } catch (e) {

        return '（要約の生成中にエラーが発生しました）';

      }

    }

      const filter =
        document.getElementById(
          'langSearch'
        ).value.toLowerCase();


      const select =
        document.getElementById(
          'langSelect'
        );


      Array.from(
        select.options
      ).forEach(
        opt => {

          opt.hidden =
            !opt.text
              .toLowerCase()
              .includes(
                filter
              );

        }
      );

    }

      const resDiv =
        document.getElementById(

      if (!input) {

        return alert(
          texts.translateRequired
        );

      }


      resDiv.textContent =
        texts.translating;


      btn.disabled =
